<div class="modal-h">
  <h2 mat-dialog-title>{{ data.editar ? 'Corregir licencia' : 'Alta de licencias' }}</h2>
  <button mat-icon-button type="button" class="cerrar" (click)="cerrar()" aria-label="Cerrar">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M6 6l12 12M18 6L6 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>
</div>

<mat-dialog-content>
  @if (data.editar) {
    <app-carga-individual
      [colegios]="data.colegios"
      [tipos]="data.tipos"
      [editar]="data.editar"
      (guardado)="guardado($event)"
      (cancelado)="cerrar()"
    />
  } @else {
    <mat-tab-group animationDuration="0ms" mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab label="Carga individual">
        <div class="tab-contenido">
          <app-carga-individual
            [colegios]="data.colegios"
            [tipos]="data.tipos"
            (guardado)="guardado($event)"
            (cancelado)="cerrar()"
          />
        </div>
      </mat-tab>
      <mat-tab label="Carga masiva por archivo">
        <div class="tab-contenido">
          <app-carga-masiva [tipos]="data.tipos" (cambio)="cambio.emit($event)" />
        </div>
      </mat-tab>
    </mat-tab-group>
  }
</mat-dialog-content>
